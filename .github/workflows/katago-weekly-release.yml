name: Weekly KataGo update

on:
  schedule:
    - cron: "17 9 * * 6"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-katago-update
  cancel-in-progress: false

jobs:
  update:
    name: Check, build, and draft release
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-2025
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: npm

      - name: Check for a KataGo update
        id: katago
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-katago-update.mjs --apply

      - name: Install dependencies
        if: steps.katago.outputs.release_needed == 'true'
        run: npm ci

      - name: Type-check application code
        if: steps.katago.outputs.release_needed == 'true'
        run: npm run typecheck

      - name: Lint application code
        if: steps.katago.outputs.release_needed == 'true'
        run: npm run lint

      - name: Run application tests
        if: steps.katago.outputs.release_needed == 'true'
        run: npm test

      - name: Check application formatting
        if: steps.katago.outputs.release_needed == 'true'
        run: npm run format:check

      - name: Cache verified KataGo downloads
        if: steps.katago.outputs.release_needed == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/katago
          key: windows-katago-${{ hashFiles('resources/katago/sources.json') }}

      - name: Download and verify KataGo resources
        if: steps.katago.outputs.release_needed == 'true'
        run: npm run resources:fetch -- --platform=win32 --arch=x64

      - name: Build Squirrel installer
        if: steps.katago.outputs.release_needed == 'true'
        run: npm run make -- --platform=win32 --arch=x64

      - name: Verify packaged KataGo files
        if: steps.katago.outputs.release_needed == 'true'
        run: |
          $resourceRoot = "out/Go Shinan-win32-x64/resources/katago"
          $required = @(
            "$resourceRoot/bin/win32-x64/katago.exe",
            "$resourceRoot/models/normal.bin.gz",
            "$resourceRoot/models/b18c384nbt-humanv0.bin.gz",
            "$resourceRoot/config/analysis.cfg",
            "$resourceRoot/manifest.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Packaged KataGo resource is missing: $file"
            }
          }

      - name: Create installer checksum and release notes
        if: steps.katago.outputs.release_needed == 'true'
        run: |
          $makerRoot = "out/make/squirrel.windows/x64"
          $installer = Get-ChildItem -LiteralPath $makerRoot -Filter "*Setup.exe" -File
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($installer.Count)"
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$makerRoot/SHA256SUMS.txt" -Encoding ascii
          @"
          Bundles KataGo ${{ steps.katago.outputs.katago_version }} Eigen AVX2 for Windows x64.

          This installer is unsigned. Verify SHA256SUMS.txt and test the draft before publishing it.
          "@ | Set-Content -LiteralPath "$makerRoot/RELEASE_NOTES.md" -Encoding utf8

      - name: Commit verified metadata and create tag
        if: steps.katago.outputs.release_needed == 'true'
        id: version
        env:
          APP_VERSION: ${{ steps.katago.outputs.app_version }}
          KATAGO_VERSION: ${{ steps.katago.outputs.katago_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json resources/katago/sources.json resources/katago/manifest.json THIRD_PARTY_NOTICES/KATAGO_WINDOWS.md
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "Update KataGo to v$env:KATAGO_VERSION"
            git push origin "HEAD:$env:DEFAULT_BRANCH"
          }

          $tag = "v$env:APP_VERSION"
          $existingTag = git tag --list $tag
          if ($existingTag) {
            $tagCommit = (git rev-list -n 1 $tag).Trim()
            $headCommit = (git rev-parse HEAD).Trim()
            if ($tagCommit -ne $headCommit) {
              throw "Existing tag $tag does not point to the verified release commit"
            }
          } else {
            git tag -a $tag -m "Go Shinan $tag (KataGo $env:KATAGO_VERSION)"
            git push origin $tag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub release
        if: steps.katago.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $makerRoot = "out/make/squirrel.windows/x64"
          $installer = Get-ChildItem -LiteralPath $makerRoot -Filter "*Setup.exe" -File
          gh release create "${{ steps.version.outputs.tag }}" `
            $installer.FullName `
            "$makerRoot/SHA256SUMS.txt" `
            --verify-tag `
            --draft `
            --title "Go Shinan ${{ steps.version.outputs.tag }}" `
            --notes-file "$makerRoot/RELEASE_NOTES.md"
