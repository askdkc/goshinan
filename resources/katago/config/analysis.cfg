# Values are deliberately conservative for desktop use. Benchmark them with
# the exact binary/model pair before release.
# Keep logs on stderr. Packaged resources may be read-only, so the engine must
# not try to create a log directory inside the application bundle.
logToStderr = true
# This desktop app submits only a small number of interactive positions at once.
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 4
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
maxVisits = 300
reportAnalysisWinratesAs = BLACK
reportDuringSearchEvery = 0.5
